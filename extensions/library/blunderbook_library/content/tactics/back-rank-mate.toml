kind = "tactic"
name = "Back-rank mate"
side = "white"
fen = "6k1/5ppp/8/8/8/8/1q3PPP/3R2K1 w - - 0 1"

idea = """
A king behind its own unmoved pawns has no square to run to. A rook or queen on the back
rank mates it, unless something can block or take. Give your own king air (h3 or g3)
before it happens to you."""

[[next]]
move = "Rd8#"
says = "Nothing can block on e8 or f8, and the king's pawns box it in."

