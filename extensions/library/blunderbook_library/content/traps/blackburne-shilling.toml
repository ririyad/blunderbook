idea = """
3... Nd4 looks like a wasted move and leaves the e5 pawn to be taken. After 4. Nxe5 Qg5
Black's queen hits both your knight and the g2 pawn. Taking on f7 for a fork seems to
win more, but it opens your king to the queen and the knight on d4."""

