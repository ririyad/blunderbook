kind = "trap"
name = "Petrov's queen trap"
opening = "Petrov's Defence"
eco = "C42"
side = "black"
moves = "1. e4 e5 2. Nf3 Nf6 3. Nxe5 Nxe4 4. Qe2"

idea = """
Copying White with 3... Nxe4 lets the queen come to e2, behind White's knight on e5.
Retreating your knight opens the e-file: White's knight moves with a discovered check
and attacks your queen at the same time."""

[[next]]
move = "4... Nf6"
line = "5. Nc6+ Be7 6. Nxd8"
says = "The knight leaves with a discovered check from the queen and takes yours next move."
loses = true

[[next]]
move = "4... Qe7"
line = "5. Qxe4 d6 6. d4 dxe5 7. dxe5"
says = "Pins the knight on e5 against White's queen: you win your piece back. Material is level, though White is a little better."

[[practise]]
answers = ["Qe7"]
prompt = "White's queen has come to e2 behind the knight on e5. Find the move that doesn't lose your queen."
