[project]
name = "blunderbook-rankings"
version = "0.1.0"
description = "A Blunderbook extension: the FIDE, Lichess and Chess.com top lists."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.15"
dependencies = [
    "blunderbook",
    "httpx>=0.28.1",
]

# How Blunderbook finds it (CLAUDE.md §15). The name is the extension's.
[project.entry-points."blunderbook.extensions"]
rankings = "blunderbook_rankings:extension"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blunderbook_rankings"
module-root = ""

[tool.uv.sources]
blunderbook = { workspace = true }
